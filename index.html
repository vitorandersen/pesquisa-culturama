<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <link rel="icon" href="culturama-favico.png">
    <link rel="stylesheet" href="css/style.css">
    <!-- Fontes (google fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Pesquisa Culturama</title>
</head>
<body>
    
    <main>
        <header>
            <img src="img/logo-culturama.png" alt="logo culturama">
            <h1>Pesquisa de Opinião</h1>
        </header>
    
        <section>
            <form action="sucesso.html" method="get"> <!-- pega valores do form e joga para url do navegador -->
                <!-- DADOS PESSOAIS -->
                <fieldset>                    
                    <legend>Dados Pessoais</legend>
                    <label for="name">Nome</label>
                    <input id="name" type="text" name="userName" required>
                    <br>
                    <label for="age">Idade</label>
                    <input id="age" type="number" name="userAge" min="12" max="100" required>
                    <br>
                    <label for="bdate">Data Nascimento</label>
                    <input id="bdate" type="date" name="birthDate">
                    <br>
                    <label for="email">Email</label>
                    <input id="email" type="email" name="userEmail">
                    <br>
                    <label for="phone">Telefone</label>
                    <input id="phone" type="tel" name="userPhone" pattern="[0-9]{11}" placeholder="DDD+Número" aria-describedby="phoneHelp">
                    <small id="phoneHelp">Preencha com 11 dígitos no formato: DDD + número, sem espaços ou hífen.</small>
                    <br>
                    <label for="photo">Upload Foto</label>
                    <input id="photo" type="file" accept="image/*" name="userPhoto">
                </fieldset>

                 <!-- PERFIL -->
                <fieldset>                   
                    <legend>Perfil</legend>

                    <p>Gênero</p>
                    <input id="fem" type="radio" name="userGender" value="Female">
                    <label for="fem">Feminino</label>
                    <input id="masc" type="radio" name="userGender" value="Male">
                    <label for="masc">Masculino</label>
                    <input id="ninf" type="radio" name="userGender" value="notInformed">
                    <label for="ninf">Não informado</label>
                    <br>
                    
                    <label for="marital">Estado civil:</label>
                    <select id="marital" name="maritalStatus">
                        <option value="notInformed">Selecione</option>
                        <option value="maried">Casado</option>
                        <option value="single">Solteiro</option>
                        <option value="divorced">Divorciado</option>
                    </select>
                    <br>
                    
                    <label for="state">Estado:</label>
                    <select id="state" name="userState" required>
                        <option value="notInformed">Selecione</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espirito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                    <br>

                    <label for="city">Cidade</label>
                    <input id="city" type="text" name="userCity">
                    <br>

                </fieldset>

                <fieldset>
                    <legend>Hábitos</legend>
                    <p>Redes Sociais</p>
                    <input id="insta" type="checkbox" name="userSocial" value="instagram">
                    <label for="insta">Instagram</label>
                    <br>
                    <input id="face" type="checkbox" name="userSocial" value="facebook">
                    <label for="face">Facebook</label>
                    <br>
                    <input id="linked" type="checkbox" name="userSocial" value="linkedin">
                    <label for="linked">LinkedIn</label>
                    <br>
                    <label for="music">Estilo Musical:</label>
                    <input id="music" list="styleType" type="text" name="musicStyle">
                    <datalist id="styleType">
                        <option value="rock">
                        <option value="samba">
                        <option value="mpb">
                    </datalist>
                    <br>
                    <label for="color">Cor Favorita:</label>
                    <input type="color" name="favoriteColor" id="color">
                </fieldset>

                <fieldset>
                    <legend>REVIEW</legend>
                    <p>Qual sua avaliação?</p>
                    <input id="bad" name="evBad" type="radio" value="bad">
                    <label for="bad">Ruim</label>
                    <input id="ok" name="evOk" type="radio" value="ok">
                    <label for="ok">Regular</label>
                    <input id="nice" name="evNice" type="radio" value="nice">
                    <label for="nice">Adorei!</label>
                    <br>
                    <label for="Comentários"></label>
                    <br>                    
                    <textarea name="userComents" id="coments" placeholder="Escreva seu comentário"></textarea>
                </fieldset>

                <fieldset>
                    <legend>LGPD - Consentimento</legend>
                    <input id="lgpd" name="userlgpd" type="checkbox" value="LGPD-confirmed" required>
                    <label for="lgpd">Eu aceito participar da pesquisa</label>
                    <br>
                    <input id="email-result" name="userEmailResult" type="checkbox" value="EmailResult-confirmed">
                    <label for="email-result">Quero receber o resultado da pesquisa por e-mail</label>
                </fieldset>
                
                <br>
                <button type="submit">Enviar</button>                
                <button type="reset">Limpar</button>


            </form>
        </section>
    </main>

    <footer>

    </footer>
    
    
</body>
</html>
